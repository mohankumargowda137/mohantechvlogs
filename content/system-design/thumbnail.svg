<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs>
<radialGradient id="glow" cx="0.85" cy="0.2" r="0.75"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.26"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#111827"/></linearGradient>
<pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.06"/></pattern>
</defs>
<rect width="1280" height="720" fill="url(#bg)"/><rect width="1280" height="720" fill="url(#dots)"/><rect width="1280" height="720" fill="url(#glow)"/>

<rect x="80" y="86" width="44" height="6" rx="3" fill="#22d3ee"/>
<text x="80" y="134" font-size="22" font-weight="800" fill="#22d3ee" letter-spacing="4">SERIES</text>
<text x="80" y="170" font-size="20" font-weight="600" fill="#94a3b8" letter-spacing="2">FROM ZERO · HANDS-ON LABS · CASE STUDIES</text>
<text font-size="84" font-weight="800" fill="#f8fafc" letter-spacing="-1.5"><tspan x="80" y="353.1">System</tspan><tspan x="80" y="447.2">Design</tspan></text>
<text x="80" y="551.3" font-size="28" font-weight="500" fill="#cbd5e1">From one server to millions of users</text>
<text x="80" y="652" font-size="20" font-weight="600" fill="#64748b">Mohan Tech Vlogs</text>

<g transform="translate(760,150)" font-size="15" font-weight="700" text-anchor="middle">
  <!-- links -->
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <path d="M200,52 L200,118" stroke="#60a5fa"/>
    <path d="M200,170 C200,200 80,200 80,232" stroke="#a78bfa"/>
    <path d="M200,170 L200,232" stroke="#a78bfa"/>
    <path d="M200,170 C200,200 320,200 320,232" stroke="#a78bfa"/>
    <path d="M80,284 C80,360 140,360 140,426" stroke="#4ade80"/>
    <path d="M200,284 L200,360" stroke="#fbbf24"/>
    <path d="M320,284 C320,360 260,360 260,426" stroke="#4ade80"/>
    <path d="M80,284 C80,330 30,350 30,420" stroke="#f472b6" stroke-dasharray="2 10"/>
  </g>
  <!-- clients -->
  <rect x="140" y="0" width="120" height="52" rx="14" fill="#1e293b" stroke="#60a5fa" stroke-width="3"/>
  <text x="200" y="32" fill="#e2e8f0">Users</text>
  <!-- load balancer -->
  <rect x="120" y="118" width="160" height="52" rx="26" fill="#a78bfa"/>
  <text x="200" y="150" fill="#0b1020">Load balancer</text>
  <!-- app servers -->
  <rect x="30" y="232" width="100" height="52" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="3"/>
  <text x="80" y="264" fill="#e2e8f0">App</text>
  <rect x="150" y="232" width="100" height="52" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="3"/>
  <text x="200" y="264" fill="#e2e8f0">App</text>
  <rect x="270" y="232" width="100" height="52" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="3"/>
  <text x="320" y="264" fill="#e2e8f0">App</text>
  <!-- cache + db -->
  <rect x="150" y="360" width="100" height="52" rx="12" fill="#fbbf24"/>
  <text x="200" y="392" fill="#0b1020">Cache</text>
  <g transform="translate(200,440)">
    <ellipse cx="-60" cy="0" rx="50" ry="12" fill="#4ade80"/>
    <rect x="-110" y="0" width="100" height="50" fill="#4ade80"/>
    <ellipse cx="-60" cy="50" rx="50" ry="12" fill="#4ade80"/>
    <ellipse cx="-60" cy="0" rx="50" ry="12" fill="#86efac"/>
    <text x="-60" y="36" fill="#0b1020">Primary</text>
    <ellipse cx="60" cy="0" rx="50" ry="12" fill="#4ade80"/>
    <rect x="10" y="0" width="100" height="50" fill="#4ade80"/>
    <ellipse cx="60" cy="50" rx="50" ry="12" fill="#4ade80"/>
    <ellipse cx="60" cy="0" rx="50" ry="12" fill="#86efac"/>
    <text x="60" y="36" fill="#0b1020">Replica</text>
  </g>
  <!-- queue -->
  <g transform="translate(-20,420)">
    <rect x="0" y="0" width="100" height="44" rx="10" fill="#1e293b" stroke="#f472b6" stroke-width="3"/>
    <rect x="12" y="12" width="14" height="20" rx="3" fill="#f472b6"/>
    <rect x="32" y="12" width="14" height="20" rx="3" fill="#f472b6"/>
    <rect x="52" y="12" width="14" height="20" rx="3" fill="#f472b6" opacity="0.6"/>
    <text x="50" y="72" fill="#f472b6">Queue</text>
  </g>
</g>
</svg>
