<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Refs are names for hashes"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0f172a"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#64748b"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#94a3b8"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#2563eb"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#7c3aed"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#16a34a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#ea580c"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#dc2626"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#d97706"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0891b2"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#db2777"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#475569"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="298.5" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text xml:space="preserve" x="32" y="46" font-size="21" fill="#0f172a" font-weight="700">Refs are names for hashes</text><rect x="32" y="120" width="150" height="76" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2.5"/><text xml:space="preserve" x="107" y="150" font-size="15" fill="#475569" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">HEAD</text><text xml:space="preserve" x="107" y="176" font-size="12" fill="#64748b" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">.git/HEAD</text><rect x="230" y="120" width="200" height="76" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text xml:space="preserve" x="330" y="150" font-size="15" fill="#2563eb" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">refs/heads/main</text><text xml:space="preserve" x="330" y="176" font-size="12" fill="#64748b" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">&quot;a3f9c2e8b1…&quot;</text><rect x="478" y="120" width="150" height="76" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text xml:space="preserve" x="553" y="150" font-size="15" fill="#2563eb" font-weight="700" text-anchor="middle">commit</text><text xml:space="preserve" x="553" y="176" font-size="12" fill="#64748b" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">a3f9c2e</text><rect x="676" y="120" width="120" height="76" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/><text xml:space="preserve" x="736" y="150" font-size="15" fill="#16a34a" font-weight="700" text-anchor="middle">tree</text><text xml:space="preserve" x="736" y="176" font-size="12" fill="#64748b" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">8f2c1d0</text><rect x="844" y="120" width="92" height="76" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/><text xml:space="preserve" x="890" y="150" font-size="15" fill="#d97706" font-weight="700" text-anchor="middle">blobs</text><text xml:space="preserve" x="890" y="176" font-size="12" fill="#64748b" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">files</text><line x1="182" y1="158" x2="226" y2="158" stroke="#475569" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-slate)"/><line x1="430" y1="158" x2="474" y2="158" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-blue)"/><line x1="628" y1="158" x2="672" y2="158" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-green)"/><line x1="796" y1="158" x2="840" y2="158" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-amber)"/><text xml:space="preserve" x="107" y="230" font-size="12" fill="#64748b" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">&quot;ref: refs/heads/main&quot;</text><text xml:space="preserve" x="330" y="230" font-size="12.5" fill="#64748b" text-anchor="middle">a branch = a file with a hash</text><text xml:space="preserve" x="480" y="276" font-size="13.5" fill="#64748b" text-anchor="middle">Switching branches rewrites .git/HEAD. Committing writes a new hash into refs/heads/main. That is all.</text></svg>
