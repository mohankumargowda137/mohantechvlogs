<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 346" width="960" height="346" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="A submodule pins another repo at one commit"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0f172a"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#64748b"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#94a3b8"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#2563eb"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#7c3aed"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#16a34a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#ea580c"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#dc2626"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#d97706"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0891b2"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#db2777"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#475569"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="344.5" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text xml:space="preserve" x="32" y="46" font-size="21" fill="#0f172a" font-weight="700">A submodule pins another repo at one commit</text><rect x="24" y="92" width="380" height="230" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><circle cx="44" cy="116" r="5" fill="#2563eb"/><text xml:space="preserve" x="58" y="121" font-size="15" fill="#0f172a" font-weight="700">acme/app (parent repo)</text><text xml:space="preserve" x="48" y="152" font-size="13.5" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">📁 src/</text><text xml:space="preserve" x="48" y="180" font-size="13.5" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">📄 package.json</text><text xml:space="preserve" x="48" y="208" font-size="13.5" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">📁 libs/</text><rect x="72" y="222" width="220.25" height="34" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/><text xml:space="preserve" x="83" y="243.5" font-size="12.5" fill="#0f172a" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">📦 design-tokens @ 4e1d2c3</text><text xml:space="preserve" x="48" y="290" font-size="12.5" fill="#64748b"><tspan x="48" dy="0">The parent stores only a commit hash,</tspan><tspan x="48" dy="18">not the submodule’s files.</tspan></text><rect x="456" y="92" width="480" height="230" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><circle cx="476" cy="116" r="5" fill="#7c3aed"/><text xml:space="preserve" x="490" y="121" font-size="15" fill="#0f172a" font-weight="700">acme/design-tokens (separate repo)</text><line x1="510" y1="210" x2="870" y2="210" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/><circle cx="510" cy="210" r="15" fill="#7c3aed" stroke="#ffffff" stroke-width="3"/><circle cx="600" cy="210" r="15" fill="#7c3aed" stroke="#ffffff" stroke-width="3"/><circle cx="690" cy="210" r="21" fill="none" stroke="#7c3aed" stroke-width="3"/><circle cx="690" cy="210" r="15" fill="#7c3aed" stroke="#ffffff" stroke-width="3"/><circle cx="780" cy="210" r="16.5" fill="#f8fafc"/><circle cx="780" cy="210" r="15" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="5 4" opacity="0.55"/><circle cx="870" cy="210" r="16.5" fill="#f8fafc"/><circle cx="870" cy="210" r="15" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="5 4" opacity="0.55"/><text xml:space="preserve" x="690" y="178" font-size="12.5" fill="#7c3aed" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">4e1d2c3</text><text xml:space="preserve" x="825" y="250" font-size="12" fill="#64748b" text-anchor="middle"><tspan x="825" dy="0">newer commits are ignored</tspan><tspan x="825" dy="17">until you bump the pointer</tspan></text><path d="M290,239 C420,300 600,300 680,232" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#a-violet)"/><rect 