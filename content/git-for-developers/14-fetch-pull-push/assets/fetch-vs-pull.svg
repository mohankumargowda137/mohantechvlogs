<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 376" width="960" height="376" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="git fetch vs git pull"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0f172a"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#64748b"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#94a3b8"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#2563eb"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#7c3aed"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#16a34a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#ea580c"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#dc2626"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#d97706"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0891b2"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#db2777"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#475569"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="374.5" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text xml:space="preserve" x="32" y="46" font-size="21" fill="#0f172a" font-weight="700">git fetch vs git pull</text><text xml:space="preserve" x="32" y="72" font-size="14.5" fill="#64748b">Fetch lets you look before you integrate; pull does both in one step.</text><rect x="24" y="96" width="912" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text xml:space="preserve" x="44" y="140" font-size="18" fill="#16a34a" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">git fetch</text><text xml:space="preserve" x="44" y="164" font-size="12.5" fill="#64748b"><tspan x="44" dy="0">download only.</tspan><tspan x="44" dy="18">Always safe.</tspan></text><rect x="230" y="122" width="180" height="66" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text xml:space="preserve" x="320" y="151" font-size="15" fill="#2563eb" font-weight="700" text-anchor="middle">GitHub</text><text xml:space="preserve" x="320" y="172" font-size="12" fill="#64748b" text-anchor="middle">new commits</text><line x1="414" y1="155" x2="466" y2="155" stroke="#16a34a" stroke-width="3" stroke-linecap="round" marker-end="url(#a-green)"/><rect x="470" y="122" width="180" height="66" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text xml:space="preserve" x="560" y="151" font-size="15" fill="#16a34a" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">origin/main</text><text xml:space="preserve" x="560" y="172" font-size="12" fill="#64748b" text-anchor="middle">updated</text><rect x="730" y="122" width="180" height="66" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/><text xml:space="preserve" x="820" y="151" font-size="15" fill="#94a3b8" font-weight="700" text-anchor="middle">main + files</text><text xml:space="preserve" x="820" y="172" font-size="12" fill="#64748b" text-anchor="middle">untouched</text><text xml:space="preserve" x="690" y="162" font-size="18" fill="#94a3b8" font-weight="700" text-anchor="middle">✕</text><rect x="24" y="232" width="912" height="120" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text xml:space="preserve" x="44" y="276" font-size="18" fill="#7c3aed" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">git pull</text><text xml:space="preserve" x="44" y="300" font-size="12.5" fill="#64748b"><tspan x="44" dy="0">fetch + merge</tspan><tspan x="44" dy="18">(or rebase)</tspan></text><rect x="230" y="258" width="180" height="66" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text xml:space="preserve" x="320" y="287" font-size="15" fill="#2563eb" font-weight="700" text-anchor="middle">GitHub</text><text xml:space="preserve" x="320" y="308" font-size="12" fill="#64748b" text-anchor="middle">new commits</text><line x1="414" y1="291" x2="466" y2="291" stroke="#16a34a" stroke-width="3" stroke-linecap="round" marker-end="url(#a-green)"/><text xml:space="preserve" x="440" y="283" font-size="12" fill="#16a34a" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">fetch</text><rect x="470" y="258" width="180" height="66" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text xml:space="preserve" x="560" y="287" font-size="15" fill="#16a34a" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">origin/main</text><text xml:space="preserve" x="560" y="308" font-size="12" fill="#64748b" text-anchor="middle">updated</text><line x1="654" y1="291" x2="726" y2="291" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" marker-end="url(#a-violet)"/><text xml:space="preserve" x="690" y="280" font-size="12" fill="#7c3aed" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">merge</text><rect x="730" y="258" width="180" height="66" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text xml:space="preserve" x="820" y="287" font-size="15" fill="#7c3aed" font-weight="700" text-anchor="middle">main + files</text><text xml:space="preserve" x="820" y="308" font-size="12" fill="#64748b" text-anchor="middle">changed for you</text></svg>
