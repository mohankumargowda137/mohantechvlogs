<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 418" width="960" height="418" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Three copies of main"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0f172a"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#64748b"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#94a3b8"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#2563eb"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#7c3aed"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#16a34a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#ea580c"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#dc2626"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#d97706"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0891b2"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#db2777"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#475569"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="416.5" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text xml:space="preserve" x="32" y="46" font-size="21" fill="#0f172a" font-weight="700">Three copies of main</text><text xml:space="preserve" x="32" y="72" font-size="14.5" fill="#64748b">Your main, your origin/main bookmark, and main on the server.</text><rect x="24" y="92" width="452" height="270" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><circle cx="44" cy="116" r="5" fill="#7c3aed"/><text xml:space="preserve" x="58" y="121" font-size="15" fill="#0f172a" font-weight="700">Your laptop</text><rect x="596" y="92" width="340" height="270" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><circle cx="616" cy="116" r="5" fill="#2563eb"/><text xml:space="preserve" x="630" y="121" font-size="15" fill="#0f172a" font-weight="700">GitHub (origin)</text><line x1="80" y1="220" x2="165" y2="220" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><line x1="165" y1="220" x2="250" y2="220" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><line x1="250" y1="220" x2="335" y2="220" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/><circle cx="80" cy="220" r="20" fill="#2563eb" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="80" y="224.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">C1</text><circle cx="165" cy="220" r="20" fill="#2563eb" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="165" y="224.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">C2</text><circle cx="250" cy="220" r="20" fill="#2563eb" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="250" y="224.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">C3</text><circle cx="335" cy="220" r="20" fill="#7c3aed" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="335" y="224.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">L1</text><line x1="335" y1="189" x2="335" y2="196" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" marker-end="url(#a-violet)"/><rect x="308.92" y="163" width="52.16" height="26" rx="13" fill="#7c3aed"/><text xml:space="preserve" x="335" y="180.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">main</text><line x1="250" y1="253" x2="250" y2="244" stroke="#2563eb" stroke-width="2" stroke-linecap="round" marker-end="url(#a-blue)"/><rect x="197.53" y="253" width="104.94" height="26" rx="13" fill="#ffffff" stroke="#2563eb" stroke-width="2" stroke-dasharray="0"/><text xml:space="preserve" x="250" y="270.68" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle">origin/main</text><text xml:space="preserve" x="363" y="225" font-size="12.5" fill="#7c3aed" font-weight="600">your commit</text><text xml:space="preserve" x="250" y="312" font-size="12" fill="#64748b" text-anchor="middle">bookmark: where GitHub</text><text xml:space="preserve" x="250" y="328" font-size="12" fill="#64748b" text-anchor="middle">was at your last fetch</text><line x1="640" y1="220" x2="720" y2="220" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><line x1="720" y1="220" x2="800" y2="220" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><line x1="800" y1="220" x2="880" y2="220" stroke="#ea580c" stroke-width="4" stroke-linecap="round"/><circle cx="640" cy="220" r="18" fill="#2563eb" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="640" y="224.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">C1</text><circle cx="720" cy="220" r="18" fill="#2563eb" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="720" y="224.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">C2</text><circle cx="800" cy="220" r="18" fill="#2563eb" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="800" y="224.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">C3</text><circle cx="880" cy="220" r="18" fill="#ea580c" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="880" y="224.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">R1</text><line x1="880" y1="191" x2="880" y2="198" stroke="#2563eb" stroke-width="2" stroke-linecap="round" marker-end="url(#a-blue)"/><rect x="853.92" y="165" width="52.16" height="26" rx="13" fill="#2563eb"/><text xml:space="preserve" x="880" y="182.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">main</text><text xml:space="preserve" x="876" y="266" font-size="12.5" fill="#ea580c" font-weight="600" text-anchor="end">teammate's push</text><line x1="592" y1="140" x2="482" y2="140" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-green)"/><text xml:space="preserve" x="537" y="128" font-size="13.5" fill="#16a34a" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">git fetch</text><text xml:space="preserve" x="536" y="162" font-size="11.5" fill="#64748b" text-anchor="middle">updates</text><text xml:space="preserve" x="536" y="176" font-size="11.5" fill="#64748b" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">origin/main</text><line x1="482" y1="300" x2="592" y2="300" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-violet)"/><text xml:space="preserve" x="537" y="288" font-size="13.5" fill="#7c3aed" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">git push</text><text xml:space="preserve" x="536" y="322" font-size="11.5" fill="#64748b" text-anchor="middle">sends main</text><text xml:space="preserve" x="480" y="394" font-size="13.5" fill="#64748b" text-anchor="middle">git status compares main with origin/main, not with GitHub itself. Run git fetch first to see what is really new.</text></svg>
