<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Anatomy of a good commit message"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0f172a"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#64748b"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#94a3b8"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#2563eb"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#7c3aed"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#16a34a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#ea580c"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#dc2626"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#d97706"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0891b2"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#db2777"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#475569"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="408.5" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text xml:space="preserve" x="32" y="46" font-size="21" fill="#0f172a" font-weight="700">Anatomy of a good commit message</text><rect x="32" y="92" width="560" height="290" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><path d="M32,126 H592" stroke="#e2e8f0" stroke-width="1.5"/><circle cx="50" cy="109" r="5" fill="#ef4444"/><circle cx="66" cy="109" r="5" fill="#f59e0b"/><circle cx="82" cy="109" r="5" fill="#22c55e"/><text xml:space="preserve" x="312" y="114" font-size="12.5" fill="#64748b" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">COMMIT_EDITMSG</text><text xml:space="preserve" x="54" y="152" font-size="14.5" fill="#0f172a" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Fix crash when cart is empty</text><text xml:space="preserve" x="54" y="179" font-size="14.5" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"></text><text xml:space="preserve" x="54" y="206" font-size="14.5" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Checkout threw a TypeError when the last item</text><text xml:space="preserve" x="54" y="233" font-size="14.5" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">was removed, because total() assumed at least</text><text xml:space="preserve" x="54" y="260" font-size="14.5" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">one item. Return 0 early for an empty cart and</text><text xml:space="preserve" x="54" y="287" font-size="14.5" fill="#334155" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">add a regression test.</text><text xml:space="preserve" x="54" y="314" font-size="14.5" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"></text><text xml:space="preserve" x="54" y="341" font-size="14.5" fill="#7c3aed" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">Fixes #482</text><path d="M600,136 h12 V160 h-12" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="612" y1="148" x2="640" y2="139" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/><text xml:space="preserve" x="648" y="144" font-size="14.5" fill="#2563eb" font-weight="700">Subject: imperative, ≤ 50 chars</text><text xml:space="preserve" x="648" y="164" font-size="12.5" fill="#64748b">&quot;If applied, this commit will…&quot;</text><path d="M600,166 h12 V186 h-12" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="612" y1="176" x2="640" y2="191" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/><text xml:space="preserve" x="648" y="196" font-size="14.5" fill="#94a3b8" font-weight="700">Blank line</text><text xml:space="preserve" x="648" y="216" font-size="12.5" fill="#64748b">separates subject from body</text><path d="M600,190 h12 V300 h-12" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="612" y1="245" x2="640" y2="249" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/><text xml:space="preserve" x="648" y="254" font-size="14.5" fill="#16a34a" font-weight="700">Body: explain WHY</text><text xml:space="preserve" x="648" y="274" font-size="12.5" fill="#64748b">wrap at ~72 characters</text><path d="M600,326 h12 V348 h-12" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="612" y1="337" x2="640" y2="329" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/><text xml:space="preserve" x="648" y="334" font-size="14.5" fill="#7c3aed" font-weight="700">Footer: issue references</text><text xml:space="preserve" x="648" y="354" font-size="12.5" fill="#64748b">GitHub closes #482 on merge</text></svg>
