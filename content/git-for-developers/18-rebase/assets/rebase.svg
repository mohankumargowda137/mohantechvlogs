<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 408" width="960" height="408" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="What git rebase does"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0f172a"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#64748b"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#94a3b8"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#2563eb"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#7c3aed"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#16a34a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#ea580c"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#dc2626"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#d97706"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0891b2"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#db2777"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#475569"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="406.5" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text xml:space="preserve" x="32" y="46" font-size="21" fill="#0f172a" font-weight="700">What git rebase does</text><text xml:space="preserve" x="32" y="72" font-size="14.5" fill="#64748b">Replay your commits on top of the latest main, as if you had started from there.</text><rect x="24" y="92" width="440" height="260" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><circle cx="44" cy="116" r="5" fill="#475569"/><text xml:space="preserve" x="58" y="121" font-size="15" fill="#0f172a" font-weight="700">Before</text><rect x="496" y="92" width="440" height="260" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><circle cx="516" cy="116" r="5" fill="#16a34a"/><text xml:space="preserve" x="530" y="121" font-size="15" fill="#0f172a" font-weight="700">After git rebase main</text><line x1="76" y1="270" x2="316" y2="270" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><path d="M156,270 C196,270 196,180 236,180" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="236" y1="180" x2="316" y2="180" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/><circle cx="76" cy="270" r="20" fill="#2563eb" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="76" y="274.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">A</text><circle cx="156" cy="270" r="20" fill="#2563eb" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="156" y="274.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">B</text><circle cx="236" cy="270" r="20" fill="#2563eb" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="236" y="274.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">D</text><circle cx="316" cy="270" r="20" fill="#2563eb" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="316" y="274.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">E</text><circle cx="236" cy="180" r="20" fill="#7c3aed" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="236" y="184.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">X</text><circle cx="316" cy="180" r="20" fill="#7c3aed" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="316" y="184.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">Y</text><rect x="353.92" y="257" width="52.16" height="26" rx="13" fill="#2563eb"/><text xml:space="preserve" x="380" y="274.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">main</text><rect x="350.61" y="167" width="74.78" height="26" rx="13" fill="#7c3aed"/><text xml:space="preserve" x="388" y="184.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">feature</text><line x1="540" y1="270" x2="750" y2="270" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><path d="M750,270 C785,270 785,180 820,180" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="820" y1="180" x2="890" y2="180" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/><circle cx="540" cy="270" r="18" fill="#2563eb" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="540" y="274.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">A</text><circle cx="610" cy="270" r="18" fill="#2563eb" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="610" y="274.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">B</text><circle cx="680" cy="270" r="18" fill="#2563eb" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="680" y="274.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">D</text><circle cx="750" cy="270" r="18" fill="#2563eb" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="750" y="274.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">E</text><circle cx="820" cy="180" r="18" fill="#7c3aed" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="820" y="184.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">X′</text><circle cx="890" cy="180" r="18" fill="#7c3aed" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="890" y="184.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">Y′</text><line x1="750" y1="295" x2="750" y2="292" stroke="#2563eb" stroke-width="2" stroke-linecap="round" marker-end="url(#a-blue)"/><rect x="723.92" y="295" width="52.16" height="26" rx="13" fill="#2563eb"/><text xml:space="preserve" x="750" y="312.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">main</text><line x1="890" y1="155" x2="890" y2="158" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" marker-end="url(#a-violet)"/><rect x="852.61" y="129" width="74.78" height="26" rx="13" fill="#7c3aed"/><text xml:space="preserve" x="890" y="146.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">feature</text><circle cx="650" cy="170" r="16.5" fill="#f8fafc"/><circle cx="650" cy="170" r="15" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="5 4" opacity="0.55"/><text xml:space="preserve" x="650" y="173.96" font-size="11" fill="#7c3aed" font-weight="700" text-anchor="middle" opacity="0.6">X</text><circle cx="694" cy="170" r="16.5" fill="#f8fafc"/><circle cx="694" cy="170" r="15" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="5 4" opacity="0.55"/><text xml:space="preserve" x="694" y="173.96" font-size="11" fill="#7c3aed" font-weight="700" text-anchor="middle" opacity="0.6">Y</text><text xml:space="preserve" x="672" y="206" font-size="11.5" fill="#94a3b8" text-anchor="middle">old X, Y (reflog only)</text><line x1="468" y1="225" x2="492" y2="225" stroke="#0f172a" stroke-width="3" stroke-linecap="round" marker-end="url(#a-ink)"/><text xml:space="preserve" x="480" y="384" font-size="13.5" fill="#64748b" text-anchor="middle">X′ and Y′ contain the same changes as X and Y, but have new parents, so they get new hashes.</text></svg>
