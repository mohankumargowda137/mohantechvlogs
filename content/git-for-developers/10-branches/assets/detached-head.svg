<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Detached HEAD"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0f172a"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#64748b"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#94a3b8"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#2563eb"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#7c3aed"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#16a34a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#ea580c"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#dc2626"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#d97706"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0891b2"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#db2777"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#475569"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="358.5" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text xml:space="preserve" x="32" y="46" font-size="21" fill="#0f172a" font-weight="700">Detached HEAD</text><text xml:space="preserve" x="32" y="72" font-size="14.5" fill="#64748b">Safe for looking around. Create a branch before you leave if you committed.</text><g transform="translate(0,40)"><line x1="110" y1="220" x2="250" y2="220" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><line x1="250" y1="220" x2="390" y2="220" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><path d="M250,220 C320,220 320,120 390,120" fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><circle cx="110" cy="220" r="20" fill="#2563eb" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="110" y="224.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">C1</text><circle cx="250" cy="220" r="20" fill="#2563eb" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="250" y="224.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">C2</text><circle cx="390" cy="220" r="20" fill="#2563eb" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="390" y="224.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">C3</text><circle cx="390" cy="120" r="21.5" fill="#f8fafc"/><circle cx="390" cy="120" r="20" fill="#ffffff" stroke="#ea580c" stroke-width="2.5" stroke-dasharray="5 4"/><text xml:space="preserve" x="390" y="124.68" font-size="13" fill="#ea580c" font-weight="700" text-anchor="middle">D1</text><line x1="250" y1="257" x2="250" y2="244" stroke="#d97706" stroke-width="2" stroke-linecap="round" marker-end="url(#a-amber)"/><path d="M233.92000000000002,257 H276.08000000000004 V283 H233.92000000000002 L223.92000000000002,270 Z" fill="#d97706"/><circle cx="233.92000000000002" cy="270" r="2.5" fill="white"/><text xml:space="preserve" x="254" y="274.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">v2.1</text><line x1="390" y1="257" x2="390" y2="244" stroke="#2563eb" stroke-width="2" stroke-linecap="round" marker-end="url(#a-blue)"/><rect x="363.92" y="257" width="52.16" height="26" rx="13" fill="#2563eb"/><text xml:space="preserve" x="390" y="274.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">main</text><line x1="390" y1="91" x2="390" y2="96" stroke="#0f172a" stroke-width="2" stroke-linecap="round" marker-end="url(#a-ink)"/><rect x="363.92" y="65" width="52.16" height="26" rx="13" fill="#0f172a"/><text xml:space="preserve" x="390" y="82.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">HEAD</text><text xml:space="preserve" x="432" y="116" font-size="13" fill="#ea580c" font-weight="600"><tspan x="432" dy="0">← HEAD points at a</tspan><tspan x="432" dy="18">   commit, not a branch</tspan></text></g><rect x="620" y="106" width="308" height="220" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text xml:space="preserve" x="640" y="134" font-size="13" fill="#ea580c" font-weight="700">git checkout v2.1, then commit D1</text><text xml:space="preserve" x="640" y="162" font-size="13" fill="#334155"><tspan x="640" dy="0">If you switch away now, no branch</tspan><tspan x="640" dy="18">points at D1. Only the reflog</tspan><tspan x="640" dy="18">remembers it.</tspan></text><text xml:space="preserve" x="640" y="246" font-size="13" fill="#0f172a" font-weight="700">Keep the work:</text><rect x="640" y="258" width="268" height="30" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text xml:space="preserve" x="651" y="277.68" font-size="13" fill="#0f172a" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">git switch -c my-fix</text></svg>
