int)"/><text xml:space="preserve" x="60" y="300" font-size="12.5" fill="#64748b">time →  (each commit points back to its parent)</text></g><rect x="660" y="110" width="268" height="190" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text xml:space="preserve" x="678" y="138" font-size="14.5" fill="#0f172a" font-weight="700">Inside .git/</text><text xml:space="preserve" x="678" y="172" font-size="13" fill="#2563eb" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">refs/heads/main</text><text xml:space="preserve" x="690" y="190" font-size="12.5" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">→ C4</text><text xml:space="preserve" x="678" y="212" font-size="13" fill="#7c3aed" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">refs/heads/feature</text><text xml:space="preserve" x="690" y="230" font-size="12.5" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">→ F2</text><text xml:space="preserve" x="678" y="252" font-size="13" fill="#0f172a" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">HEAD</text><text xml:space="preserve" x="690" y="270" font-size="12.5" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">→ refs/heads/feature</text></svg>
