<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Edit → add → commit"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0f172a"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#64748b"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#94a3b8"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#2563eb"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#7c3aed"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#16a34a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#ea580c"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#dc2626"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#d97706"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0891b2"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#db2777"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#475569"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="408.5" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text xml:space="preserve" x="32" y="46" font-size="21" fill="#0f172a" font-weight="700">Edit → add → commit</text><text xml:space="preserve" x="32" y="72" font-size="14.5" fill="#64748b">Saving a version always takes two steps: choose what to save, then save it.</text><rect x="32" y="96" width="236" height="210" rx="14" fill="#ffffff" stroke="#ea580c" stroke-width="2.5"/><path d="M33.25,149.25 V110.25 Q33.25,97.25 46.25,97.25 H253.75 Q266.75,97.25 266.75,110.25 V149.25 Z" fill="#fff7ed"/><circle cx="60" cy="123" r="12" fill="#ea580c"/><text xml:space="preserve" x="60" y="127.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text xml:space="preserve" x="80" y="129" font-size="18" fill="#ea580c" font-weight="700">Edit files</text><text xml:space="preserve" x="52" y="176" font-size="13" fill="#64748b">in your project folder</text><text xml:space="preserve" x="52" y="210" font-size="12.5" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">$ git status</text><rect x="46" y="222" width="208" height="64" rx="8" fill="#0f172a" stroke="none" stroke-width="1.5"/><text xml:space="preserve" x="56" y="246" font-size="11.5" fill="#f87171" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"><tspan x="56" dy="0">Untracked files:</tspan><tspan x="56" dy="16">    index.html</tspan></text><rect x="362" y="96" width="236" height="210" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><path d="M363.25,149.25 V110.25 Q363.25,97.25 376.25,97.25 H583.75 Q596.75,97.25 596.75,110.25 V149.25 Z" fill="#eff6ff"/><circle cx="390" cy="123" r="12" fill="#2563eb"/><text xml:space="preserve" x="390" y="127.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text xml:space="preserve" x="410" y="129" font-size="18" fill="#2563eb" font-weight="700">Stage</text><text xml:space="preserve" x="382" y="176" font-size="13" fill="#64748b">chosen for the next commit</text><text xml:space="preserve" x="382" y="210" font-size="12.5" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">$ git status</text><rect x="376" y="222" width="208" height="64" rx="8" fill="#0f172a" stroke="none" stroke-width="1.5"/><text xml:space="preserve" x="386" y="246" font-size="11.5" fill="#4ade80" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"><tspan x="386" dy="0">Changes to be committed:</tspan><tspan x="386" dy="16">    new file: index.html</tspan></text><rect x="692" y="96" width="236" height="210" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/><path d="M693.25,149.25 V110.25 Q693.25,97.25 706.25,97.25 H913.75 Q926.75,97.25 926.75,110.25 V149.25 Z" fill="#f0fdf4"/><circle cx="720" cy="123" r="12" fill="#16a34a"/><text xml:space="preserve" x="720" y="127.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text xml:space="preserve" x="740" y="129" font-size="18" fill="#16a34a" font-weight="700">Commit</text><text xml:space="preserve" x="712" y="176" font-size="13" fill="#64748b">a snapshot saved in .git</text><text xml:space="preserve" x="712" y="210" font-size="12.5" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">$ git status</text><rect x="706" y="222" width="208" height="64" rx="8" fill="#0f172a" stroke="none" stroke-width="1.5"/><text xml:space="preserve" x="716" y="246" font-size="11.5" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace"><tspan x="716" dy="0">nothing to commit,</tspan><tspan x="716" dy="16">working tree clean</tspan></text><line x1="272" y1="200" x2="358" y2="200" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-blue)"/><text xml:space="preserve" x="315" y="186" font-size="13.5" fill="#2563eb" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">git add</text><line x1="602" y1="200" x2="688" y2="200" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-green)"/><text xml:space="preserve" x="645" y="186" font-size="13.5" fill="#16a34a" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">git commit</text><path d="M810,310 C810,370 150,370 150,312" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5" marker-end="url(#a-faint)"/><text xml:space="preserve" x="480" y="384" font-size="13" fill="#64748b" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">edit again… and repeat</text></svg>
