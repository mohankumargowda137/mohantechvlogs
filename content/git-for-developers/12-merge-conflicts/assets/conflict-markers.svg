<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 476" width="960" height="476" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Reading a merge conflict"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0f172a"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#64748b"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#94a3b8"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#2563eb"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#7c3aed"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#16a34a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#ea580c"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#dc2626"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#d97706"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0891b2"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#db2777"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#475569"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="474.5" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text xml:space="preserve" x="32" y="46" font-size="21" fill="#0f172a" font-weight="700">Reading a merge conflict</text><text xml:space="preserve" x="32" y="72" font-size="14.5" fill="#64748b">With merge.conflictStyle = zdiff3 you also see what the code looked like before either change.</text><rect x="32" y="92" width="560" height="340" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><path d="M32,126 H592" stroke="#e2e8f0" stroke-width="1.5"/><circle cx="50" cy="109" r="5" fill="#ef4444"/><circle cx="66" cy="109" r="5" fill="#f59e0b"/><circle cx="82" cy="109" r="5" fill="#22c55e"/><text xml:space="preserve" x="312" y="114" font-size="12.5" fill="#64748b" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">src/cart.js</text><text xml:space="preserve" x="56" y="140" font-size="14" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">function total(items, discount) {</text><text xml:space="preserve" x="56" y="168" font-size="14" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">  const sum = items.reduce(add, 0);</text><rect x="40" y="177" width="544" height="28" fill="#eff6ff"/><text xml:space="preserve" x="56" y="196" font-size="14" fill="#2563eb" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">&lt;&lt;&lt;&lt;&lt;&lt;&lt; HEAD</text><rect x="40" y="205" width="544" height="28" fill="#eff6ff"/><text xml:space="preserve" x="56" y="224" font-size="14" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">  return sum * TAX;</text><rect x="40" y="233" width="544" height="28" fill="#f1f5f9"/><text xml:space="preserve" x="56" y="252" font-size="14" fill="#475569" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">||||||| base</text><rect x="40" y="261" width="544" height="28" fill="#f1f5f9"/><text xml:space="preserve" x="56" y="280" font-size="14" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">  return sum;</text><rect x="40" y="289" width="544" height="28" fill="#f1f5f9"/><text xml:space="preserve" x="56" y="308" font-size="14" fill="#64748b" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">=======</text><rect x="40" y="317" width="544" height="28" fill="#f5f3ff"/><text xml:space="preserve" x="56" y="336" font-size="14" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">  return sum - discount;</text><rect x="40" y="345" width="544" height="28" fill="#f5f3ff"/><text xml:space="preserve" x="56" y="364" font-size="14" fill="#7c3aed" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">&gt;&gt;&gt;&gt;&gt;&gt;&gt; feature/discounts</text><text xml:space="preserve" x="56" y="392" font-size="14" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">}</text><line x1="596" y1="205" x2="628" y2="205" stroke="#2563eb" stroke-width="2" stroke-linecap="round" marker-end="url(#a-blue)"/><text xml:space="preserve" x="640" y="202" font-size="14.5" fill="#2563eb" font-weight="700">OURS</text><text xml:space="preserve" x="640" y="221" font-size="12.5" fill="#64748b">the branch you are on (main): added TAX</text><line x1="596" y1="264" x2="628" y2="264" stroke="#475569" stroke-width="2" stroke-linecap="round" marker-end="url(#a-slate)"/><text xml:space="preserve" x="640" y="261" font-size="14.5" fill="#475569" font-weight="700">BASE (zdiff3 only)</text><text xml:space="preserve" x="640" y="280" font-size="12.5" fill="#64748b">the original both sides started from</text><line x1="596" y1="346" x2="628" y2="346" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" marker-end="url(#a-violet)"/><text xml:space="preserve" x="640" y="343" font-size="14.5" fill="#7c3aed" font-weight="700">THEIRS</text><text xml:space="preserve" x="640" y="362" font-size="12.5" fill="#64748b">the branch being merged: added discount</text><rect x="620" y="384" width="308" height="64" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text xml:space="preserve" x="636" y="406" font-size="13.5" fill="#16a34a" font-weight="700">Resolved: keep both changes</text><text xml:space="preserve" x="636" y="432" font-size="13" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">return (sum - discount) * TAX;</text></svg>
