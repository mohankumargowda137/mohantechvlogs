rient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#d97706"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0891b2"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#db2777"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#475569"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="378.5" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text xml:space="preserve" x="32" y="46" font-size="21" fill="#0f172a" font-weight="700">Where client-side hooks run</text><text xml:space="preserve" x="32" y="72" font-size="14.5" fill="#64748b">Hooks are scripts in .git/hooks (or core.hooksPath). Non-zero exit = stop.</text><text xml:space="preserve" x="32" y="110" font-size="13" fill="#475569" font-weight="700">Committing</text><rect x="32" y="136" width="104.35" height="34" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text xml:space="preserve" x="43" y="157.86" font-size="13.5" fill="#0f172a" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">git commit</text><line x1="140" y1="153" x2="160" y2="153" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#a-faint)"/><rect x="164" y="124" width="140" height="58" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text xml:space="preserve" x="234" y="150" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">pre-commit</text><text xml:space="preserve" x="234" y="169" font-size="11.5" fill="#dc2626" font-weight="600" text-anchor="middle">can block</text><line x1="304" y1="153" x2="324" y2="153" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#a-faint)"/><rect x="328" y="124" width="190" height="58" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text xml:space="preserve" x="423" y="150" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">prepare-commit-msg</text><text xml:space="preserve" x="423" y="169" font-size="11.5" fill="#dc2626" font-weight="600" text-anchor="middle">can block</text><line x1="518" y1="153" x2="538" y2="153" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#a-faint)"/><rect x="542" y="124" width="140" height="58" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text xml:space="preserve" x="612" y="150" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">commit-msg</text><text xml:space="preserve" x="612" y="169" font-size="11.5" fill="#dc2626" font-weight="600" text-anchor="middle">can block</text><line x1="682" y1="153" x2="702" y2="153" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#a-faint)"/><rect x="706" y="132" width="130" height="42" rx="21" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text xml:space="preserve" x="771" y="158" font-size="13" fill="#16a34a" font-weight="700" text-anchor="middle">commit created</text><line x1="836" y1="153" x2="852" y2="153" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#a-faint)"/><rect x="854" y="124" width="88" height="58" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text xml:space="preserve" x="898" y="150" font-size="11.5" fill="#0f172a" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">post-commit</text><text xml:space="preserve" x="898" y="169" font-size="11.5" fill="#64748b" text-anchor="middle">notify only</text><path d="M234,182 V220" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#a-red)"/><text xml:space="preserve" x="244" y="216" font-size="12.5" fill="#dc2626" font-weight="600">exit 1 → commit aborted (e.g. lint failed)</text><text xml:space="preserve" x="32" y="276" font-size="13" fill="#475569" font-weight="700">Pushing</text><rect x="32" y="302" width="87.88" height="34" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text xml:space="preserve" x="43" y="323.86" font-size="13.5" fill="#0f172a" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">git push</text><line x1="124" y1="319" x2="160" y2="319" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#a-faint)"/><rect x="164" y="290" width="140" height="58" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text xml:space="preserve" x="234" y="316" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">pre-push</text><text xml:space="preserve" x="234" y="335" font-size="11.5" fill="#dc2626" font-weight="600" text-anchor="middle">can block</text><line x1="304" y1="319" x2="324" y2="319" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#a-faint)"/><rect x="328" y="298" width="130" height="42" rx="21" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text xml:space="preserve" x="393" y="324" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle">sent to remote</text><text xml:space="preserve" x="520" y="276" font-size="13" fill="#475569" font-weight="700">Switching / pulling</text><rect x="520" y="302" width="161.995" height="34" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.5"/><text xml:space="preserve" x="531" y="323.86" font-size="13.5" fill="#0f172a" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">git switch / pull</text><line x1="684" y1="319" x2="704" y2="319" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" marker-end="url(#a-faint)"/><rect x="708" y="290" width="230" height="58" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text xml:space="preserve" x="823" y="316" font-size="13.5" fill="#0f172a" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">post-checkout / merge</text><text xml:space="preserve" x="823" y="335" font-size="11.5" fill="#64748b" text-anchor="middle">notify only</text></svg>
