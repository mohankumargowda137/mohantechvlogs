ient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#d97706"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0891b2"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#db2777"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#475569"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="422.5" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text xml:space="preserve" x="32" y="46" font-size="21" fill="#0f172a" font-weight="700">The life of a pull request</text><rect x="40" y="110" width="196" height="84" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/><circle cx="66" cy="140" r="12" fill="#7c3aed"/><text xml:space="preserve" x="66" y="144.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text xml:space="preserve" x="86" y="146" font-size="16" fill="#7c3aed" font-weight="700">Branch</text><text xml:space="preserve" x="60" y="174" font-size="12.5" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">git switch -c</text><rect x="266" y="110" width="196" height="84" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/><circle cx="292" cy="140" r="12" fill="#7c3aed"/><text xml:space="preserve" x="292" y="144.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text xml:space="preserve" x="312" y="146" font-size="16" fill="#7c3aed" font-weight="700">Commit</text><text xml:space="preserve" x="286" y="174" font-size="12.5" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Me