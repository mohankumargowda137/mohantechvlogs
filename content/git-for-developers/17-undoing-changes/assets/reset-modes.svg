okeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#d97706"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0891b2"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#db2777"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#475569"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="478.5" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text xml:space="preserve" x="32" y="46" font-size="21" fill="#0f172a" font-weight="700">git reset: --soft vs --mixed vs --hard</text><line x1="120" y1="130" x2="240" y2="130" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><line x1="240" y1="130" x2="360" y2="130" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 5"/><circle cx="120" cy="130" r="20" fill="#2563eb" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="120" y="134.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">C1</text><circle cx="240" cy="130" r="20" fill="#2563eb" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="240" y="134.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">C2</text><circle cx="360" cy="130" r="21.5" fill="#f8fafc"/><circle cx="360" cy="130" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="5 4" opacity="0.55"/><text xml:space="preserve" x="360" y="134.68" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle" opacity="0.6">C3</text><line x1="240" y1="159" x2="240" y2="154" stroke="#2563eb" stroke-width="2" stroke-linecap="round" marker-end="url(#a-blue)"/><rect x="213.92000000000002" y="159" width="52.16" height="26" rx="13" fill="#2563eb"/><text xml:space="preserve" x="240" y="176.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">main</text><rect x="333.92" y="169" width="52.16" height="26" rx="13" fill="#ffffff" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 3" opacity="0.6"/><text xml:space="preserve" x="360" y="186.68" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle" opacity="0.7">main</text><line x1="330" y1="190" x2="274" y2="190" stroke="#2563eb" stroke-width="2" stroke-linecap="round" marker-end="url(#a-blue)"/><text xml:space="preserve" x="420" y="124" font-size="15" fill="#0f172a" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">git reset &lt;mode&gt; HEAD~1</text><text xml:space="preserve" x="420" y="148" font-size="13" fill="#64748b">All three modes move main from C3 back to C2.</text><text xml:space="preserve" x="420" y="168" font-size="13" fill="#64748b">They differ in what happens to C3’s changes:</text><text xml:space="preserve" x="364" y="240" font-size="14" fill="#475569" font-weight="700" text-anchor="middle">Branch pointer</text><text xml:space="preserve" x="584" y="240" font-size="14" fill="#475569" font-weight="700" text-anchor="middle">Staging area</text><text xml:space="preserve" x="804" y="240" font-size="14" fill="#475569" font-weight="700" text-anchor="middle">Working tree</text><rect x="24" y="258" width="912" height="60" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text xml:space="preserve" x="44" y="288" font-size="17" fill="#0f172a" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">--soft</text><text xml:space="preserve" x="44" y="306" font-size="12" fill="#64748b">keep everything staged</text><rect x="260" y="270" width="208" height="36" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text xml:space="preserve" x="364" y="293" font-size="13" fill="#2563eb" font-weight="600" text-anchor="middle">moved to C2</text><rect x="480" y="270" width="208" height="36" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text xml:space="preserve" x="584" y="293" font-size="13" fill="#16a34a" font-weight="600" text-anchor="middle">C3’s changes staged</text><rect x="700" y="270" width="208" height="36" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text xml:space="preserve" x="804" y="293" font-size="13" fill="#16a34a" font-weight="600" text-anchor="middle">kept</text><rect x="24" y="328" width="912" height="60" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text xml:space="preserve" x="44" y="358" font-size="17" fill="#0f172a" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">--mixed</text><text xml:space="preserve" x="44" y="376" font-size="12" fill="#64748b">default</text><rect x="260" y="340" width="208" height="36" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text xml:space="preserve" x="364" y="363" font-size="13" fill="#2563eb" font-weight="600" text-anchor="middle">moved to C2</text><rect x="480" y="340" width="208" height="36" rx="18" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text xml:space="preserve" x="584" y="363" font-size="13" fill="#d97706" font-weight="600" text-anchor="middle">reset (unstaged)</text><rect x="700" y="340" width="208" height="36" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text xml:space="preserve" x="804" y="363" font-size="13" fill="#16a34a" font-weight="600" text-anchor="middle">kept</text><rect x="24" y="398" width="912" height="60" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text xml:space="preserve" x="44" y="428" font-size="17" fill="#dc2626" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">--hard</text><text xml:space="preserve" x="44" y="446" font-size="12" fill="#64748b">careful!</text><rect x="260" y="410" width="208" height="36" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text xml:space="preserve" x="364" y="433" font-size="13" fill="#2563eb" font-weight="600" text-anchor="middle">moved to C2</text><rect x="480" y="410" width="208" height="36" rx="18" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text xml:space="preserve" x="584" y="433" font-size="13" fill="#d97706" font-weight="600" text-anchor="middle">reset</text><rect x="700" y="410" width="208" height="36" rx="18" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text xml:space="preserve" x="804" y="433" font-size="13" fill="#dc2626" font-weight="600" text-anchor="middle">changes DELETED</text></svg>
