<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 386" width="960" height="386" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="reset vs revert"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0f172a"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#64748b"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#94a3b8"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#2563eb"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#7c3aed"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#16a34a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#ea580c"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#dc2626"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#d97706"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0891b2"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#db2777"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#475569"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="384.5" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text xml:space="preserve" x="32" y="46" font-size="21" fill="#0f172a" font-weight="700">reset vs revert</text><text xml:space="preserve" x="32" y="72" font-size="14.5" fill="#64748b">Rewrite history (local only) or add an undo commit (safe everywhere).</text><rect x="24" y="92" width="448" height="270" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><circle cx="44" cy="116" r="5" fill="#dc2626"/><text xml:space="preserve" x="58" y="121" font-size="15" fill="#0f172a" font-weight="700">git reset --hard HEAD~1</text><rect x="488" y="92" width="448" height="270" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><circle cx="508" cy="116" r="5" fill="#16a34a"/><text xml:space="preserve" x="522" y="121" font-size="15" fill="#0f172a" font-weight="700">git revert C</text><line x1="90" y1="200" x2="200" y2="200" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><line x1="200" y1="200" x2="310" y2="200" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 5"/><circle cx="90" cy="200" r="20" fill="#2563eb" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="90" y="204.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">A</text><circle cx="200" cy="200" r="20" fill="#2563eb" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="200" y="204.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">B</text><circle cx="310" cy="200" r="21.5" fill="#f8fafc"/><circle cx="310" cy="200" r="20" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="5 4" opacity="0.55"/><text xml:space="preserve" x="310" y="204.68" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle" opacity="0.6">C</text><line x1="296" y1="186" x2="324" y2="214" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/><line x1="324" y1="186" x2="296" y2="214" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/><line x1="200" y1="229" x2="200" y2="224" stroke="#2563eb" stroke-width="2" stroke-linecap="round" marker-end="url(#a-blue)"/><rect x="173.92000000000002" y="229" width="52.16" height="26" rx="13" fill="#2563eb"/><text xml:space="preserve" x="200" y="246.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">main</text><text xml:space="preserve" x="48" y="300" font-size="13.5" fill="#dc2626" font-weight="600">History rewritten: C is gone from main.</text><text xml:space="preserve" x="48" y="322" font-size="12.5" fill="#64748b"><tspan x="48" dy="0">Anyone who already pulled C now has</tspan><tspan x="48" dy="18">a different history than the server.</tspan></text><line x1="550" y1="200" x2="650" y2="200" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><line x1="650" y1="200" x2="750" y2="200" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><line x1="750" y1="200" x2="860" y2="200" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/><circle cx="550" cy="200" r="20" fill="#2563eb" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="550" y="204.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">A</text><circle cx="650" cy="200" r="20" fill="#2563eb" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="650" y="204.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">B</text><circle cx="750" cy="200" r="20" fill="#2563eb" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="750" y="204.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">C</text><circle cx="860" cy="200" r="20" fill="#16a34a" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="860" y="204.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">C⁻¹</text><text xml:space="preserve" x="860" y="160" font-size="12.5" fill="#16a34a" font-weight="600" text-anchor="middle">&quot;Revert C&quot;</text><line x1="860" y1="229" x2="860" y2="224" stroke="#2563eb" stroke-width="2" stroke-linecap="round" marker-end="url(#a-blue)"/><rect x="833.92" y="229" width="52.16" height="26" rx="13" fill="#2563eb"/><text xml:space="preserve" x="860" y="246.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">main</text><text xml:space="preserve" x="512" y="300" font-size="13.5" fill="#16a34a" font-weight="600">History kept: a new commit undoes C.</text><text xml:space="preserve" x="512" y="322" font-size="12.5" fill="#64748b"><tspan x="512" dy="0">Safe on shared branches. Push normally,</tspan><tspan x="512" dy="18">no force push needed.</tspan></text></svg>
