<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Revision shortcuts"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0f172a"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#64748b"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#94a3b8"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#2563eb"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#7c3aed"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#16a34a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#ea580c"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#dc2626"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#d97706"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0891b2"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#db2777"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#475569"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="418.5" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text xml:space="preserve" x="32" y="46" font-size="21" fill="#0f172a" font-weight="700">Revision shortcuts</text><text xml:space="preserve" x="32" y="72" font-size="14.5" fill="#64748b">Use these anywhere Git expects a commit: log, diff, show, reset, rebase…</text><line x1="160" y1="270" x2="320" y2="270" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><line x1="320" y1="270" x2="480" y2="270" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><line x1="480" y1="270" x2="640" y2="270" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><line x1="640" y1="270" x2="800" y2="270" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><path d="M320,270 C400,270 400,160 480,160" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="480" y1="160" x2="640" y2="160" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/><path d="M640,160 C720,160 720,270 800,270" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="800" cy="270" r="22" fill="#16a34a" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="800" y="274.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">M</text><circle cx="640" cy="270" r="20" fill="#2563eb" stroke="#ffffff" stroke-width="3"/><circle cx="480" cy="270" r="20" fill="#2563eb" stroke="#ffffff" stroke-width="3"/><circle cx="320" cy="270" r="20" fill="#2563eb" stroke="#ffffff" stroke-width="3"/><circle cx="160" cy="270" r="20" fill="#2563eb" stroke="#ffffff" stroke-width="3"/><circle cx="640" cy="160" r="20" fill="#7c3aed" stroke="#ffffff" stroke-width="3"/><circle cx="480" cy="160" r="20" fill="#7c3aed" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="800" y="320" font-size="14" fill="#16a34a" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">HEAD  (@)</text><text xml:space="preserve" x="800" y="338" font-size="11.5" fill="#64748b" text-anchor="middle">a merge commit</text><text xml:space="preserve" x="640" y="236" font-size="14" fill="#2563eb" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">HEAD~1</text><text xml:space="preserve" x="640" y="316" font-size="12.5" fill="#64748b" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">= HEAD^ = HEAD^1</text><text xml:space="preserve" x="480" y="236" font-size="14" fill="#2563eb" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">HEAD~2</text><text xml:space="preserve" x="320" y="236" font-size="14" fill="#2563eb" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">HEAD~3</text><text xml:space="preserve" x="160" y="236" font-size="14" fill="#2563eb" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">HEAD~4</text><text xml:space="preserve" x="640" y="126" font-size="14" fill="#7c3aed" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">HEAD^2</text><text xml:space="preserve" x="640" y="144" font-size="11.5" fill="#64748b" text-anchor="middle">second parent</text><text xml:space="preserve" x="480" y="126" font-size="14" fill="#7c3aed" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">HEAD^2~1</text><line x1="480" y1="305" x2="480" y2="294" stroke="#2563eb" stroke-width="2" stroke-linecap="round" marker-end="url(#a-blue)"/><rect x="401.14" y="305" width="157.72" height="26" rx="13" fill="#ffffff" stroke="#2563eb" stroke-width="2" stroke-dasharray="0"/><text xml:space="preserve" x="480" y="322.68" font-size="13" fill="#2563eb" font-weight="700" text-anchor="middle">@{u} = origin/main</text><text xml:space="preserve" x="480" y="360" font-size="11.5" fill="#64748b" text-anchor="middle">your upstream branch</text><text xml:space="preserve" x="32" y="396" font-size="13.5" fill="#64748b">~n walks back n first parents.  ^2 picks a merge’s second parent.  @{u}.. = commits you have not pushed yet.</text></svg>
