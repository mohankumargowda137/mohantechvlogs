<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" width="960" height="370" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Three levels of Git config"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0f172a"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#64748b"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#94a3b8"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#2563eb"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#7c3aed"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#16a34a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#ea580c"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#dc2626"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#d97706"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0891b2"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#db2777"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#475569"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="368.5" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text xml:space="preserve" x="32" y="46" font-size="21" fill="#0f172a" font-weight="700">Three levels of Git config</text><text xml:space="preserve" x="32" y="72" font-size="14.5" fill="#64748b">Git reads all three; when a setting appears twice, the more specific level wins.</text><rect x="72" y="100" width="520" height="70" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text xml:space="preserve" x="92" y="128" font-size="17" fill="#2563eb" font-weight="700">Local</text><text xml:space="preserve" x="151.3" y="128" font-size="13.5" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">--local</text><text xml:space="preserve" x="92" y="152" font-size="13" fill="#334155">.git/config (this repo)</text><text xml:space="preserve" x="574" y="145" font-size="12.5" fill="#0f172a" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">user.email = blog@asha.dev</text><rect x="52" y="186" width="560" height="70" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text xml:space="preserve" x="72" y="214" font-size="17" fill="#7c3aed" font-weight="700">Global</text><text xml:space="preserve" x="141.16" y="214" font-size="13.5" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">--global</text><text xml:space="preserve" x="72" y="238" font-size="13" fill="#334155">~/.gitconfig (you)</text><text xml:space="preserve" x="594" y="231" font-size="12.5" fill="#0f172a" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">user.email = asha@example.com</text><rect x="32" y="272" width="600" height="70" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text xml:space="preserve" x="52" y="300" font-size="17" fill="#475569" font-weight="700">System</text><text xml:space="preserve" x="121.16" y="300" font-size="13.5" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">--system</text><text xml:space="preserve" x="52" y="324" font-size="13" fill="#334155">/etc/gitconfig (machine)</text><text xml:space="preserve" x="614" y="317" font-size="12.5" fill="#0f172a" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">core.autocrlf = input</text><line x1="656" y1="336" x2="656" y2="110" stroke="#16a34a" stroke-width="3" stroke-linecap="round" marker-end="url(#a-green)"/><text xml:space="preserve" x="668" y="206" font-size="13.5" fill="#16a34a" font-weight="700"><tspan x="668" dy="0">more</tspan><tspan x="668" dy="19">specific</tspan><tspan x="668" dy="19">wins</tspan></text><rect x="752" y="150" width="184" height="120" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><text xml:space="preserve" x="768" y="178" font-size="11.5" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">$ git config user.email</text><text xml:space="preserve" x="768" y="210" font-size="13.5" fill="#16a34a" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">blog@asha.dev</text><text xml:space="preserve" x="768" y="240" font-size="12" fill="#64748b"><tspan x="768" dy="0">local overrides the</tspan><tspan x="768" dy="17">global value</tspan></text></svg>
