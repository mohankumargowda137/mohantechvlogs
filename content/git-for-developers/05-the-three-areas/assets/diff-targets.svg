rient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#d97706"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0891b2"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#db2777"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#475569"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="348.5" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text xml:space="preserve" x="32" y="46" font-size="21" fill="#0f172a" font-weight="700">What does git diff compare?</text><text xml:space="preserve" x="32" y="72" font-size="14.5" fill="#64748b">Each form compares two of the three areas.</text><rect x="40" y="96" width="240" height="64" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/><text xml:space="preserve" x="160" y="134" font-size="16" fill="#ea580c" font-weight="700" text-anchor="middle">Working tree</text><rect x="360" y="96" width="240" height="64" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text xml:space="preserve" x="480" y="134" font-size="16" fill="#2563eb" font-weight="700" text-anchor="middle">Staging area</text><rect x="680" y="96" width="240" height="64" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/><text xml:space="preserve" x="800" y="134" font-size="16" fill="#16a34a" font-weight="700" text-anchor="middle">Last commit (HEAD)</text><line x1="160" y1="162" x2="160" y2="206" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 4"/><line x1="480" y1="162" x2="480" y2="206" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 4"/><line x1="164" y1="206" x2="476" y2="206" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-blue)" marker-start="url(#a-blue)"/><rect x="273.84000000000003" y="190" width="92.32" height="30" rx="15" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text xml:space="preserve" x="320" y="210" font-size="14" fill="#2563eb" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">git diff</text><text xml:space="preserve" x="320" y="240" font-size="12.5" fill="#64748b" text-anchor="middle">unstaged changes</text><line x1="480" y1="162" x2="480" y2="206" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 4"/><line x1="800" y1="162" x2="800" y2="206" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 4"/><line x1="484" y1="206" x2="796" y2="206" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-green)" marker-start="url(#a-green)"/><rect x="555.41" y="190" width="169.18" height="30" rx="15" fill="#ffffff" stroke="#16a34a" stroke-width="2"/><text xml:space="preserve" x="640" y="210" font-size="14" fill="#16a34a" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">git diff --staged</text><text xml:space="preserve" x="640" y="240" font-size="12.5" fill="#64748b" text-anchor="middle">what you are about to commit</text><line x1="160" y1="162" x2="160" y2="290" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 4"/><line x1="800" y1="162" x2="800" y2="290" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 4"/><line x1="164" y1="290" x2="796" y2="290" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-violet)" marker-start="url(#a-violet)"/><rect x="412.49" y="274" width="135.01999999999998" height="30" rx="15" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/><text xml:space="preserve" x="480" y="294" font-size="14" fill="#7c3aed" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">git diff HEAD</text><text xml:space="preserve" x="480" y="324" font-size="12.5" fill="#64748b" text-anchor="middle">all changes since the last commit</text></svg>
