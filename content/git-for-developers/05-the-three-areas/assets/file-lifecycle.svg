<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The life of a file"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0f172a"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#64748b"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#94a3b8"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#2563eb"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#7c3aed"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#16a34a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#ea580c"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#dc2626"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#d97706"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0891b2"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#db2777"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#475569"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="318.5" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text xml:space="preserve" x="32" y="46" font-size="21" fill="#0f172a" font-weight="700">The life of a file</text><text xml:space="preserve" x="32" y="72" font-size="14.5" fill="#64748b">git status tells you which of these states each file is in.</text><rect x="32" y="150" width="166" height="70" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 4"/><text xml:space="preserve" x="115" y="182" font-size="17" fill="#475569" font-weight="700" text-anchor="middle">Untracked</text><text xml:space="preserve" x="115" y="203" font-size="12.5" fill="#64748b" text-anchor="middle">new to Git</text><rect x="266" y="150" width="166" height="70" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/><text xml:space="preserve" x="349" y="182" font-size="17" fill="#16a34a" font-weight="700" text-anchor="middle">Unmodified</text><text xml:space="preserve" x="349" y="203" font-size="12.5" fill="#64748b" text-anchor="middle">same as last commit</text><rect x="500" y="150" width="166" height="70" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/><text xml:space="preserve" x="583" y="182" font-size="17" fill="#ea580c" font-weight="700" text-anchor="middle">Modified</text><text xml:space="preserve" x="583" y="203" font-size="12.5" fill="#64748b" text-anchor="middle">changed, not staged</text><rect x="734" y="150" width="166" height="70" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/><text xml:space="preserve" x="817" y="182" font-size="17" fill="#2563eb" font-weight="700" text-anchor="middle">Staged</text><text xml:space="preserve" x="817" y="203" font-size="12.5" fill="#64748b" text-anchor="middle">in the next commit</text><path d="M115,150 V108 H817 V146" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/><text xml:space="preserve" x="480" y="100" font-size="14" fill="#2563eb" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">git add  (start tracking)</text><line x1="434" y1="185" x2="498" y2="185" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-orange)"/><text xml:space="preserve" x="466" y="177" font-size="13.5" fill="#ea580c" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">edit</text><line x1="668" y1="185" x2="732" y2="185" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-blue)"/><text xml:space="preserve" x="700" y="177" font-size="13" fill="#2563eb" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">git add</text><path d="M817,222 V284 H386 V224" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)"/><text xml:space="preserve" x="600" y="300" font-size="14" fill="#16a34a" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">git commit</text><path d="M296,222 V256 H115 V224" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#a-slate)"/><text xml:space="preserve" x="205" y="276" font-size="13" fill="#475569" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">git rm --cached</text></svg>
