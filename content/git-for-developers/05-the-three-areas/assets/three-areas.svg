<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 396" width="960" height="396" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The three areas of Git"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0f172a"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#64748b"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#94a3b8"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#2563eb"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#7c3aed"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#16a34a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#ea580c"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#dc2626"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#d97706"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0891b2"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#db2777"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#475569"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="394.5" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text xml:space="preserve" x="32" y="46" font-size="21" fill="#0f172a" font-weight="700">The three areas of Git</text><rect x="40" y="130" width="240" height="170" rx="14" fill="#ffffff" stroke="#ea580c" stroke-width="2.5"/><path d="M41.25,181.25 V144.25 Q41.25,131.25 54.25,131.25 H265.75 Q278.75,131.25 278.75,144.25 V181.25 Z" fill="#fff7ed"/><text xml:space="preserve" x="60" y="158" font-size="17" fill="#ea580c" font-weight="700">Working tree</text><text xml:space="preserve" x="60" y="174" font-size="12" fill="#64748b">files you edit</text><rect x="360" y="130" width="240" height="170" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><path d="M361.25,181.25 V144.25 Q361.25,131.25 374.25,131.25 H585.75 Q598.75,131.25 598.75,144.25 V181.25 Z" fill="#eff6ff"/><text xml:space="preserve" x="380" y="158" font-size="17" fill="#2563eb" font-weight="700">Staging area</text><text xml:space="preserve" x="380" y="174" font-size="12" fill="#64748b">the next commit (index)</text><rect x="680" y="130" width="240" height="170" rx="14" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/><path d="M681.25,181.25 V144.25 Q681.25,131.25 694.25,131.25 H905.75 Q918.75,131.25 918.75,144.25 V181.25 Z" fill="#f0fdf4"/><text xml:space="preserve" x="700" y="158" font-size="17" fill="#16a34a" font-weight="700">Repository</text><text xml:space="preserve" x="700" y="174" font-size="12" fill="#64748b">.git: committed history</text><rect x="60" y="196" width="200" height="30" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text xml:space="preserve" x="71" y="215.5" font-size="12.5" fill="#0f172a" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">app.js       modified</text><rect x="60" y="232" width="200" height="30" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/><text xml:space="preserve" x="71" y="251.5" font-size="12.5" fill="#0f172a" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">README.md    modified</text><rect x="60" y="268" width="200" height="30" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/><text xml:space="preserve" x="71" y="287.5" font-size="12.5" fill="#0f172a" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">new.js       untracked</text><rect x="380" y="196" width="200" height="30" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text xml:space="preserve" x="391" y="215.5" font-size="12.5" fill="#0f172a" font-weight="500" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">app.js       staged</text><text xml:space="preserve" x="380" y="256" font-size="12.5" fill="#64748b"><tspan x="380" dy="0">Only what you add here</tspan><tspan x="380" dy="18">goes into the commit.</tspan></text><line x1="720" y1="230" x2="780" y2="230" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/><line x1="780" y1="230" x2="840" y2="230" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/><circle cx="720" cy="230" r="18" fill="#16a34a" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="720" y="234.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">C1</text><circle cx="780" cy="230" r="18" fill="#16a34a" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="780" y="234.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">C2</text><circle cx="840" cy="230" r="18" fill="#16a34a" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="840" y="234.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">C3</text><rect x="815.08" y="262.5" width="49.839999999999996" height="25" rx="12.5" fill="#16a34a"/><text xml:space="preserve" x="840" y="279.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">main</text><path d="M200,120 Q300,86 400,120" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/><text xml:space="preserve" x="300" y="95" font-size="15" fill="#2563eb" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">git add</text><path d="M520,120 Q620,86 720,120" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-green)"/><text xml:space="preserve" x="620" y="95" font-size="15" fill="#16a34a" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">git commit</text><path d="M400,312 Q300,342 200,312" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-orange)"/><text xml:space="preserve" x="300" y="352" font-size="13.5" fill="#ea580c" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">git restore &lt;file&gt;</text><text xml:space="preserve" x="300" y="370" font-size="12" fill="#64748b" text-anchor="middle">discards working-tree edits</text><path d="M720,312 Q620,342 520,312" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-blue)"/><text xml:space="preserve" x="620" y="352" font-size="13.5" fill="#2563eb" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">git restore --staged</text><text xml:space="preserve" x="620" y="370" font-size="12" fill="#64748b" text-anchor="middle">unstages, keeps your edits</text></svg>
