idth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#d97706"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0891b2"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#db2777"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#475569"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="442.5" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text xml:space="preserve" x="32" y="46" font-size="21" fill="#0f172a" font-weight="700">Three ways to merge a pull request</text><text xml:space="preserve" x="32" y="72" font-size="14.5" fill="#64748b">Feature branch with commits F1, F2, F3, started from A while main moved on to B.</text><rect x="24" y="92" width="912" height="120" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text xml:space="preserve" x="40" y="144" font-size="15.5" fill="#2563eb" font-weight="700">Merge commit</text><text xml:space="preserve" x="40" y="164" font-size="12.5" fill="#64748b">full detail, plus a merge commit</text><line x1="320" y1="176" x2="400" y2="176" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><line x1="400" y1="176" x2="720" y2="176" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><path d="M320,176 C400,176 400,124 480,124" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="480" y1="124" x2="560" y2="124" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/><line x1="560" y1="124" x2="640" y2="124" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/><path d="M640,124 C