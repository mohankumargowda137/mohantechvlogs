start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#d97706"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0891b2"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#db2777"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#475569"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="338.5" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text xml:space="preserve" x="32" y="46" font-size="21" fill="#0f172a" font-weight="700">Three-way merge</text><text xml:space="preserve" x="32" y="72" font-size="14.5" fill="#64748b">Both branches moved on, so Git creates a merge commit.</text><line x1="110" y1="230" x2="230" y2="230" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><line x1="230" y1="230" x2="350" y2="230" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><line x1="350" y1="230" x2="500" y2="230" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><path d="M110,230 C170,230 170,130 230,130" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><line x1="230" y1="130" x2="350" y2="130" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/><path d="M350,130 C425,130 425,230 500,230" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="110" cy="230" r="26" fill="none" stroke="#d97706" stroke-width="3"/><circle cx="110" cy="230" r="20" fill="#475569" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="110" y="234.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">B</text><circle cx="230" cy="230" r="20" fill="#2563eb" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="230" y="234.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">M1</text><circle cx="350" cy="230" r="20" fill="#2563eb" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="350" y="234.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">M2</text><circle cx="230" cy="130" r="20" fill="#7c3aed" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="230" y="134.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">F1</text><circle cx="350" cy="130" r="20" fill="#7c3aed" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="350" y="134.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">F2</text><circle cx="500" cy="230" r="30" fill="none" stroke="#16a34a" stroke-width="3"/><circle cx="500" cy="230" r="24" fill="#16a34a" stroke="#ffffff" stroke-width="3"/><text xml:space="preserve" x="500" y="234.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">M</text><text xml:space="preserve" x="110" y="290" font-size="13" fill="#d97706" font-weight="700" text-anchor="middle">merge base</text><text xml:space="preserve" x="500" y="290" font-size="13" fill="#16a34a" font-weight="700" text-anchor="middle"><tspan x="500" dy="0">merge commit</tspan><tspan x="500" dy="18">(2 parents)</tspan></text><line x1="350" y1="99" x2="350" y2="106" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" marker-end="url(#a-violet)"/><rect x="312.61" y="73" width="74.78" height="26" rx="13" fill="#7c3aed"/><text xml:space="preserve" x="350" y="90.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">feature</text><line x1="500" y1="153" x2="500" y2="206" stroke="#2563eb" stroke-width="2" stroke-linecap="round" marker-end="url(#a-blue)"/><rect x="473.92" y="127" width="52.16" height="26" rx="13" fill="#2563eb"/><text xml:space="preserve" x="500" y="144.68" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">main</text><rect x="600" y="96" width="328" height="220" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/><text xml:space="preserve" x="620" y="126" font-size="14.5" fill="#0f172a" font-weight="700">Git compares three snapshots:</text><circle cx="632" cy="158" r="12" fill="#d97706"/><text xml:space="preserve" x="632" y="162.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text xml:space="preserve" x="652" y="163" font-size="13.5" fill="#0f172a">B: the merge base</text><circle cx="632" cy="192" r="12" fill="#2563eb"/><text xml:space="preserve" x="632" y="196.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text xml:space="preserve" x="652" y="197" font-size="13.5" fill="#0f172a">M2: ours (main)</text><circle cx="632" cy="226" r="12" fill="#7c3aed"/><text xml:space="preserve" x="632" y="230.5" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text xml:space="preserve" x="652" y="231" font-size="13.5" fill="#0f172a">F2: theirs (feature)</text><text xml:space="preserve" x="620" y="266" font-size="12.5" fill="#64748b"><tspan x="620" dy="0">Changes B→M2 and B→F2 are combined</tspan><tspan x="620" dy="18">into M. Same lines changed? Conflict.</tspan></text></svg>
