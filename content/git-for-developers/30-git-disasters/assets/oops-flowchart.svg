<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Which undo do I need?"><defs><marker id="a-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0f172a"/></marker><marker id="a-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#64748b"/></marker><marker id="a-faint" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#94a3b8"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#2563eb"/></marker><marker id="a-violet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#7c3aed"/></marker><marker id="a-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#16a34a"/></marker><marker id="a-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#ea580c"/></marker><marker id="a-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#dc2626"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#d97706"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#0891b2"/></marker><marker id="a-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#db2777"/></marker><marker id="a-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" markerUnits="strokeWidth" orient="auto-start-reverse"><path d="M0,0.5 L10,5 L0,9.5 z" fill="#475569"/></marker></defs><rect x="0.75" y="0.75" width="958.5" height="568.5" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><text xml:space="preserve" x="32" y="46" font-size="21" fill="#0f172a" font-weight="700">Which undo do I need?</text><rect x="560" y="96" width="300" height="58" rx="29" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/><text xml:space="preserve" x="710" y="131" font-size="15" fill="#0f172a" font-weight="700" text-anchor="middle">Is the mistake committed?</text><rect x="560" y="226" width="300" height="58" rx="29" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/><text xml:space="preserve" x="710" y="261" font-size="15" fill="#0f172a" font-weight="700" text-anchor="middle">Has it been pushed?</text><rect x="560" y="356" width="300" height="58" rx="29" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/><text xml:space="preserve" x="710" y="391" font-size="15" fill="#0f172a" font-weight="700" text-anchor="middle">Do others use that branch?</text><line x1="710" y1="154" x2="710" y2="222" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-ink)"/><text xml:space="preserve" x="732" y="192" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">yes</text><line x1="710" y1="284" x2="710" y2="352" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-ink)"/><text xml:space="preserve" x="732" y="322" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">yes</text><line x1="710" y1="414" x2="710" y2="470" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-ink)"/><text xml:space="preserve" x="732" y="446" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">yes</text><line x1="556" y1="125" x2="444" y2="125" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-ink)"/><text xml:space="preserve" x="500" y="117" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">no</text><line x1="556" y1="255" x2="444" y2="255" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-ink)"/><text xml:space="preserve" x="500" y="247" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">no</text><line x1="556" y1="385" x2="444" y2="385" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" marker-end="url(#a-ink)"/><text xml:space="preserve" x="500" y="377" font-size="13" fill="#0f172a" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">no</text><rect x="32" y="86" width="408" height="104" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text xml:space="preserve" x="48" y="112" font-size="14" fill="#2563eb" font-weight="700">Uncommitted changes</text><text xml:space="preserve" x="48" y="136" font-size="12.5" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">git restore &lt;file&gt;          # discard</text><text xml:space="preserve" x="48" y="157" font-size="12.5" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">git restore --staged &lt;file&gt; # unstage</text><text xml:space="preserve" x="48" y="178" font-size="12.5" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">git stash                   # park it</text><rect x="32" y="206" width="408" height="104" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text xml:space="preserve" x="48" y="232" font-size="14" fill="#7c3aed" font-weight="700">Local commits: rewrite freely</text><text xml:space="preserve" x="48" y="256" font-size="12.5" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">git commit --amend</text><text xml:space="preserve" x="48" y="277" font-size="12.5" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">git reset --soft HEAD~1</text><text xml:space="preserve" x="48" y="298" font-size="12.5" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">git rebase -i main</text><rect x="32" y="336" width="408" height="92" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/><text xml:space="preserve" x="48" y="362" font-size="14" fill="#0891b2" font-weight="700">Your own pushed branch</text><text xml:space="preserve" x="48" y="386" font-size="12.5" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">rewrite as above, then</text><text xml:space="preserve" x="48" y="407" font-size="12.5" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">git push --force-with-lease</text><rect x="520" y="474" width="380" height="72" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/><text xml:space="preserve" x="536" y="500" font-size="14" fill="#16a34a" font-weight="700">Shared branch (main, develop)</text><text xml:space="preserve" x="536" y="524" font-size="12.5" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">git revert &lt;commit&gt;   # never rewrite</text><rect x="32" y="462" width="408" height="84" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text xml:space="preserve" x="48" y="488" font-size="14" fill="#dc2626" font-weight="700">Lost something after reset / rebase?</text><text xml:space="preserve" x="48" y="512" font-size="12.5" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">git reflog</text><text xml:space="preserve" x="48" y="533" font-size="12.5" fill="#0f172a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">git reset --hard HEAD@{n}</text></svg>
